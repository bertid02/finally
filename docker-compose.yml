# `docker compose up -d` and the scripts in scripts/ drive the *same* container
# and the *same* volume, deliberately: the image tag, container name and volume
# name are pinned identically in both, so starting with one and stopping with
# the other works. Without `name:` on the volume, Compose would prefix it with
# the project name and the two paths would keep separate databases.

services:
  finally:
    build:
      context: .
      dockerfile: Dockerfile
    image: finally:latest
    container_name: finally
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - finally-data:/app/db
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u, sys; sys.exit(0 if u.urlopen('http://127.0.0.1:8000/api/health', timeout=4).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  finally-data:
    name: finally-data
