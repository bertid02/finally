# `docker compose up -d` and the scripts in scripts/ drive the *same* container
# and the *same* volume, deliberately: the image tag, container name and volume
# name are pinned identically in both, so starting with one and stopping with
# the other works. Without `name:` on the volume, Compose would prefix it with
# the project name and the two paths would keep separate databases.

services:
  finally:
    build:
      context: .
      dockerfile: Dockerfile
    image: finally:latest
    container_name: finally
    ports:
      - "8000:8000"
    # Long-form with `required: false` so a fresh clone works: .env is gitignored
    # and does not exist until the user creates it. Without this, `docker compose
    # up` dies on a stat error before the app ever starts, which breaks the
    # one-command promise. Absent .env means no OPENROUTER_API_KEY, so the app
    # runs fine on the simulator and only the AI chat panel is dead.
    # Needs Compose >= 2.24 (Docker Desktop 4.27, Jan 2024). On anything older,
    # `cp .env.example .env` first, or use scripts/start_mac.sh which checks.
    env_file:
      - path: .env
        required: false
    volumes:
      - finally-data:/app/db
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u, sys; sys.exit(0 if u.urlopen('http://127.0.0.1:8000/api/health', timeout=4).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  finally-data:
    name: finally-data
